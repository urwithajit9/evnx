# The labelled scan corpus (RM-70). Read by tests/scan_quality.rs.
#
# Each [[case]] is one file the scanner is run over:
#   id        unique, and the folder the file is written into
#   family    what the case is about (cloud, vcs, payment, chat, keys, ...);
#             precision and recall are reported per family
#   format    how the file is read (dotenv, yaml, json, ipynb, dockerfile,
#             shell, text); reported per format too
#   as        the file name written to disk. The scanner decides how to read
#             a file from its name, so this matters.
#   expect    every finding the scanner MUST report, as { line, rule } and
#             optionally also = [other rule ids that count as finding it].
#             A case
#             with no expect is a look-alike: any finding in it is a false
#             positive. A finding in a positive case that is not listed is a
#             false positive as well.
#
# The template for a case is cases/<id>.tpl. A template never holds a secret:
# `{{...}}` markers are filled at test time from parts (see the module docs of
# tests/scan_quality.rs for the markers).

# ── Must be found ────────────────────────────────────────────────────────

[[case]]
id = "pos-cloud-aws-dotenv"
family = "cloud"
format = "dotenv"
as = ".env"
expect = [
  { line = 3, rule = "aws-access-key" },
  { line = 4, rule = "aws-secret-access-key" },
]

