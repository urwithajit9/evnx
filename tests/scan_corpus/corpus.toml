id = "pos-cloud-aws-sts"
family = "cloud"
format = "dotenv"
as = ".env.production"
expect = [
  { line = 1, rule = "aws-temporary-access-key" },
  { line = 2, rule = "sensitive-config-key", also = ["aws-secret-access-key"] },
]

