# cargo-deny: licences, duplicate crates and where crates come from.
#
# Advisories are not checked here: the `audit` job runs `cargo audit`, with its
# documented exceptions in `.cargo/audit.toml`. CI runs
# `cargo deny check licenses bans sources`.

[graph]
# Every feature, so the optional dependencies of `cloud`, `migrate` and
# `backup` are judged too: the prebuilt binaries are built with all of them.
all-features = true

[licenses]
# Exactly the licences the dependency tree needs today. For a crate offered
# under `A OR B`, one allowed side is enough, so the permissive choice that
# carries the crate is what is listed. A new licence fails the check until
# someone decides to accept it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MIT-0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Zlib is accepted for one crate only, not for the whole tree. foldhash 0.2
# (Zlib, a permissive licence with no notice-in-binary requirement) comes in
# through yaml-rust2 -> hashlink -> hashbrown 0.17, the YAML reader that
# replaced serde_yaml. `cargo tree -e normal --all-features -i foldhash@0.2.0`
# shows the path. A second Zlib crate fails the check until it is decided too.
exceptions = [
    { allow = ["Zlib"], crate = "foldhash" },
]

[bans]
# Two versions of one crate are common (a dependency lags another's major
# version) and are not a failure; they show up as a warning.
multiple-versions = "warn"
# A dependency written as `"*"` accepts any release, including a malicious one.
wildcards = "deny"

[sources]
# Crates come from crates.io, nowhere else: no git dependency and no other
# registry can enter the tree unnoticed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
