# The rules evnx ships, as data (v0.13.0 C2, RM-50). Compiled into the binary
# with `include_str!` and loaded once by `core::secretscan::rules`.
#
# Each rule:
#   id          stable, kebab-case. It is the SARIF ruleId and, from C5, the key a
#               baseline and an `evnx:allow` marker name. ⚠️ Never rename one: a
#               renamed id is a new rule to every tool that tracks findings.
#   name        what output calls it
#   provider    who issues the credential (required for built-ins, RM-90)
#   category    one of cloud, source-ci, ai, payments, databases-backends, auth,
#               messaging-email, observability, infra-secrets, saas,
#               keys-certificates, generic (required for built-ins)
#   regex       matched against values and whole lines (Rust `regex`: linear time)
#   confidence  how SURE a match is that it is this provider's credential
#   severity    how BAD it is if real: critical, high, medium or low
#   url         where to revoke it, when there is one place
#   names       optional: regexes matched against the name of the variable or key
#               the value is attached to (a `.env` name, a YAML/JSON/TOML leaf
#               key). A rule with `names` fires only where the name matches, and
#               never on text with no name; where it and an unconstrained rule
#               match the same value, it wins. For a provider that reuses
#               another's prefix (Clerk and UploadThing use Stripe's `sk_live_`).
#   entropy     optional: a match whose Shannon entropy is below this is dropped
#
# Severity, by kind: critical = direct access to money, cloud accounts, AI
# billing or signing keys; high = account tokens and database passwords;
# medium = often-public tokens (JWTs); low = test keys and keys designed to ship
# in a web page.
#
# A loader test refuses a duplicate id, a missing field and a regex that does
# not compile (`rules::tests`). Every rule has a fixture file,
# `tests/fixtures/rules/<id>.toml`, with values that must match and near misses
# that must not; `tests/rule_fixtures.rs` fails for a rule without one.
#
# ⛔ What gets a rule here (S1, C3): the provider documents a FIXED PREFIX, or a
# fixed length and charset that ordinary values do not share. A shape anything
# else can have stays with the entropy fallback and the name rule, because a
# rule that matches ordinary data is noise in every project. Left out on that
# ground, on purpose:
#   Postmark server tokens, Heroku legacy API keys   a UUID, like any UUID
#   Cloudflare API tokens                            40 characters, no prefix
#   Datadog API and application keys                 plain hex, no prefix
# Regexes adapted from gitleaks (MIT, github.com/gitleaks/gitleaks) say so.

version = 1

[[rules]]
id = "aws-access-key"
name = "AWS Access Key"
provider = "AWS"
category = "cloud"
regex = 'AKIA[0-9A-Z]{16}'
confidence = "high"
severity = "critical"
url = "https://console.aws.amazon.com/iam"

# ⚠️ `ASIA`, not only `AKIA`. An STS temporary key is a live credential until it
# expires, and it is what every CI role assumption hands out, so it is the form
# most likely to be pasted into a `.env` by accident. Named separately from the
# long-term key so the output says which kind it found.
[[rules]]
id = "aws-temporary-access-key"
name = "AWS Temporary Access Key (STS)"
provider = "AWS"
category = "cloud"
regex = 'ASIA[0-9A-Z]{16}'
confidence = "high"
severity = "critical"
url = "https://console.aws.amazon.com/iam"

# ⚠️ The fine-grained PAT, which the `ghp_|gho_|ghu_|ghs_|ghr_` alternation below
# cannot match: different prefix, different length.
[[rules]]
id = "github-fine-grained-pat"
name = "GitHub Fine-grained PAT"
provider = "GitHub"
category = "source-ci"
regex = 'github_pat_[A-Za-z0-9_]{40,}'
confidence = "high"
severity = "high"
url = "https://github.com/settings/personal-access-tokens"

# Bot, user, app-level and legacy tokens share the `xox<x>-` shape; `xapp-` is
# the app-level token and has its own prefix.
[[rules]]
id = "slack-token"
name = "Slack Token"
provider = "Slack"
category = "messaging-email"
regex = 'xox[abprs]-[0-9A-Za-z-]{10,}|xapp-[0-9]-[A-Za-z0-9-]{10,}'
confidence = "high"
severity = "high"
url = "https://api.slack.com/apps"

# ⚠️ The case that split severity from confidence (S7). The shape is
# unmistakable, so confidence is high; but a Google API key is often a browser
# key (Maps, Places) meant to ship in a page and restricted by referrer instead
# of secrecy, so severity is low. Until C2 this was `confidence = "medium"`,
# which said the wrong thing: evnx was never unsure what it was.
[[rules]]
id = "google-api-key"
name = "Google API Key"
provider = "Google"
category = "cloud"
regex = 'AIza[0-9A-Za-z_\-]{35}'
confidence = "high"
severity = "low"
url = "https://console.cloud.google.com/apis/credentials"

# ⚠️ Medium confidence and medium severity: plenty of JWTs are public ID tokens.
# What makes one sensitive is usually the variable it sits in, which the name
# heuristic covers separately.
[[rules]]
id = "jwt"
name = "JSON Web Token"
provider = "JWT"
category = "keys-certificates"
regex = 'eyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}'
confidence = "medium"
severity = "medium"

[[rules]]
id = "stripe-live-secret-key"
name = "Stripe Secret Key (LIVE)"
provider = "Stripe"
category = "payments"
regex = 'sk_live_[0-9a-zA-Z]{24,}'
confidence = "high"
severity = "critical"
url = "https://dashboard.stripe.com/apikeys"

# ⚠️ Clerk and UploadThing reuse Stripe's `sk_live_` prefix, so the value alone
# cannot tell them apart. `names` does: under these variable names the finding is
# theirs (and so is the dashboard to revoke it in); under any other name, or in
# plain text, it stays `stripe-live-secret-key`. Clerk's `sk_test_` development
# keys are not split out: Stripe's test rule (low) keeps reporting them.
[[rules]]
id = "clerk-secret-key"
name = "Clerk Secret Key (LIVE)"
provider = "Clerk"
category = "auth"
regex = 'sk_live_[0-9a-zA-Z]{24,}'
names = ['(?i)^(NEXT_)?CLERK_(SECRET_KEY|API_KEY)$']
confidence = "high"
severity = "critical"
url = "https://dashboard.clerk.com"

[[rules]]
id = "uploadthing-secret-key"
name = "UploadThing Secret Key"
provider = "UploadThing"
category = "saas"
regex = 'sk_live_[0-9a-zA-Z]{24,}'
names = ['(?i)^UPLOADTHING_(SECRET|SECRET_KEY|TOKEN)$']
confidence = "high"
severity = "critical"
url = "https://uploadthing.com/dashboard"

[[rules]]
id = "stripe-test-secret-key"
name = "Stripe Secret Key (test)"
provider = "Stripe"
category = "payments"
regex = 'sk_test_[0-9a-zA-Z]{24,}'
confidence = "medium"
severity = "low"
url = "https://dashboard.stripe.com/apikeys"

# The three GitHub forms in one alternation with one name.
[[rules]]
id = "github-token"
name = "GitHub Token"
provider = "GitHub"
category = "source-ci"
regex = '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,40}\b'
confidence = "high"
severity = "high"
url = "https://github.com/settings/tokens"

# ⚠️ Two exclusive branches, not `(?:proj-)?`. Anthropic keys also begin `sk-`,
# and a permissive form swallowed them.
# C3: service-account and admin keys share the project key's shape.
[[rules]]
id = "openai-api-key"
name = "OpenAI API Key"
provider = "OpenAI"
category = "ai"
regex = 'sk-(?:(?:proj|svcacct|admin)-[0-9a-zA-Z_-]{40,}|[0-9a-zA-Z]{48})'
confidence = "high"
severity = "critical"
url = "https://platform.openai.com/api-keys"

[[rules]]
id = "anthropic-api-key"
name = "Anthropic API Key"
provider = "Anthropic"
category = "ai"
regex = 'sk-ant-api[0-9]{2}-[0-9a-zA-Z\-_]{95}'
confidence = "high"
severity = "critical"
url = "https://console.anthropic.com/settings/keys"

# C3: named apart from the PEM rule below, which matches the same header, so
# the output says "OpenSSH". Declared first so it wins the tie.
[[rules]]
id = "openssh-private-key"
name = "OpenSSH Private Key"
provider = "OpenSSH"
category = "keys-certificates"
regex = '-----BEGIN OPENSSH PRIVATE KEY-----'
confidence = "high"
severity = "critical"

# ⚠️ `[A-Z0-9 ]*`, not `[A-Z ]+ `. PKCS#8 writes a bare `-----BEGIN PRIVATE
# KEY-----` with no algorithm, OpenSSL's default since 3.0.
[[rules]]
id = "private-key"
name = "Private Key"
provider = "PEM"
category = "keys-certificates"
regex = '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'
confidence = "high"
severity = "critical"

# ⚠️ The most common thing in a `.env` after an API key, and it scanned clean
# before this rule (D15): no provider prefix, a name with no secret word in it,
# and a whole URL scores below the entropy threshold.
#
# The classes exclude `/`, `?` and `#`, so the userinfo cannot run past the
# authority into a path (`https://host/users/me@example.com` is a URL, not a
# credential). Requiring `:` before `@` means `postgresql://reader@host/db` is
# a bare username, which is not a secret. No url: the place to rotate a database
# password is the database.
[[rules]]
id = "connection-string-credentials"
name = "Credentials in a connection string"
provider = "Generic"
category = "databases-backends"
regex = '[a-zA-Z][a-zA-Z0-9+.\-]*://[^\s/?#@]+:[^\s/?#@]+@[^\s/?#]+'
confidence = "high"
severity = "high"

# ── C3, first wave (2026-11-07) ────────────────────────────────────────────

[[rules]]
id = "stripe-restricted-key"
name = "Stripe Restricted Key (LIVE)"
provider = "Stripe"
category = "payments"
regex = '\brk_live_[0-9a-zA-Z]{24,}'
confidence = "high"
severity = "high"
url = "https://dashboard.stripe.com/apikeys"

# The `AccountKey=` of a storage connection string: 64 bytes, base64.
[[rules]]
id = "azure-storage-account-key"
name = "Azure Storage Account Key"
provider = "Azure"
category = "cloud"
regex = 'AccountKey=[A-Za-z0-9+/]{86}=='
confidence = "high"
severity = "critical"
url = "https://portal.azure.com/"

# A SAS URL: a dated `sv=` and a `sig=` signature.
[[rules]]
id = "azure-sas-token"
name = "Azure SAS Token"
provider = "Azure"
category = "cloud"
regex = '''[?&]sv=[0-9]{4}-[0-9]{2}-[0-9]{2}&[^\s"'<>]*?\bsig=[A-Za-z0-9%+/]{30,}'''
confidence = "high"
severity = "high"
url = "https://portal.azure.com/"

# ⚠️ Medium confidence: `SK` plus 32 hex characters is Twilio's documented
# shape, and also what a 32-character hex value prefixed SK can be by chance.
[[rules]]
id = "twilio-api-key"
name = "Twilio API Key"
provider = "Twilio"
category = "messaging-email"
regex = '\bSK[0-9a-fA-F]{32}\b'
confidence = "medium"
severity = "high"
url = "https://console.twilio.com/"

[[rules]]
id = "sendgrid-api-key"
name = "SendGrid API Key"
provider = "SendGrid"
category = "messaging-email"
regex = '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'
confidence = "high"
severity = "high"
url = "https://app.sendgrid.com/settings/api_keys"

# Mailgun's legacy private API key. Medium: `key-` is a common word prefix.
[[rules]]
id = "mailgun-api-key"
name = "Mailgun API Key"
provider = "Mailgun"
category = "messaging-email"
regex = '\bkey-[0-9a-zA-Z]{32}\b'
confidence = "medium"
severity = "high"
url = "https://app.mailgun.com/settings/api_security"

# Personal access (`dop_`), OAuth (`doo_`) and refresh (`dor_`) tokens.
[[rules]]
id = "digitalocean-token"
name = "DigitalOcean Token"
provider = "DigitalOcean"
category = "cloud"
regex = '\bdo[opr]_v1_[a-f0-9]{64}\b'
confidence = "high"
severity = "critical"
url = "https://cloud.digitalocean.com/account/api/tokens"

[[rules]]
id = "npm-access-token"
name = "npm Access Token"
provider = "npm"
category = "source-ci"
regex = '\bnpm_[A-Za-z0-9]{36}\b'
confidence = "high"
severity = "high"
url = "https://docs.npmjs.com/revoking-access-tokens"

# A PyPI API token is a macaroon whose fixed header encodes "pypi.org".
[[rules]]
id = "pypi-api-token"
name = "PyPI API Token"
provider = "PyPI"
category = "source-ci"
regex = '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}'
confidence = "high"
severity = "high"
url = "https://pypi.org/manage/account/token/"

[[rules]]
id = "docker-hub-pat"
name = "Docker Hub Access Token"
provider = "Docker Hub"
category = "source-ci"
regex = '\bdckr_pat_[A-Za-z0-9_-]{27}\b'
confidence = "high"
severity = "high"
url = "https://app.docker.com/settings/personal-access-tokens"

# Admin API (`shpat_`), custom app (`shpca_`), private app (`shppa_`) tokens and
# the shared secret (`shpss_`).
[[rules]]
id = "shopify-token"
name = "Shopify Access Token"
provider = "Shopify"
category = "saas"
regex = '\bshp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}\b'
confidence = "high"
severity = "high"
url = "https://help.shopify.com/en/manual/apps/app-types/custom-apps"

# Vault 1.10+ service (`hvs.`) and batch (`hvb.`) tokens.
[[rules]]
id = "hashicorp-vault-token"
name = "HashiCorp Vault Token"
provider = "HashiCorp"
category = "infra-secrets"
regex = '\bhv[sb]\.[A-Za-z0-9_-]{24,}'
confidence = "high"
severity = "critical"

[[rules]]
id = "gitlab-pat"
name = "GitLab Personal Access Token"
provider = "GitLab"
category = "source-ci"
regex = '\bglpat-[A-Za-z0-9_-]{20}\b'
confidence = "high"
severity = "high"
url = "https://gitlab.com/-/user_settings/personal_access_tokens"

[[rules]]
id = "huggingface-token"
name = "Hugging Face Token"
provider = "Hugging Face"
category = "ai"
regex = '\bhf_[A-Za-z]{34}\b'
confidence = "high"
severity = "high"
url = "https://huggingface.co/settings/tokens"

# Heroku's 2024 key format; the older UUID keys are left out (see the header).
[[rules]]
id = "heroku-api-key"
name = "Heroku API Key"
provider = "Heroku"
category = "cloud"
regex = '\bHRKU-AA[0-9a-zA-Z_-]{58}\b'
confidence = "high"
severity = "high"
url = "https://dashboard.heroku.com/account/applications"

# ⚠️ Low severity: a DSN is meant to ship in client code. It lets anyone send
# events to the project, which is spam, not access.
[[rules]]
id = "sentry-dsn"
name = "Sentry DSN"
provider = "Sentry"
category = "observability"
regex = 'https://[0-9a-f]{32}@o[0-9]+\.ingest(?:\.[a-z]{2})?\.sentry\.io/[0-9]+'
confidence = "high"
severity = "low"
url = "https://docs.sentry.io/concepts/key-terms/dsn-explainer/"

# Organisation (`sntrys_`) and user (`sntryu_`) auth tokens: these are access.
[[rules]]
id = "sentry-auth-token"
name = "Sentry Auth Token"
provider = "Sentry"
category = "observability"
regex = '\bsntry[su]_[A-Za-z0-9+/=_-]{40,}'
confidence = "high"
severity = "high"
url = "https://sentry.io/settings/account/api/auth-tokens/"

[[rules]]
id = "linear-api-key"
name = "Linear API Key"
provider = "Linear"
category = "saas"
regex = '\blin_api_[A-Za-z0-9]{40}\b'
confidence = "high"
severity = "high"
url = "https://linear.app/settings/api"

# ⚠️ Medium confidence: three dot-separated base64 parts is also the outline of
# other tokens. The leading character encodes the bot's user id.
[[rules]]
id = "discord-bot-token"
name = "Discord Bot Token"
provider = "Discord"
category = "messaging-email"
regex = '\b[MNO][A-Za-z0-9_-]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,38}\b'
confidence = "medium"
severity = "high"
url = "https://discord.com/developers/applications"

[[rules]]
id = "telegram-bot-token"
name = "Telegram Bot Token"
provider = "Telegram"
category = "messaging-email"
regex = '\b[0-9]{8,10}:AA[0-9A-Za-z_-]{33}\b'
confidence = "high"
severity = "high"
url = "https://core.telegram.org/bots#how-do-i-create-a-bot"

# An incoming webhook posts to a channel; it grants no read access.
[[rules]]
id = "slack-webhook-url"
name = "Slack Webhook URL"
provider = "Slack"
category = "messaging-email"
regex = 'https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24}'
confidence = "high"
severity = "medium"
url = "https://api.slack.com/apps"

[[rules]]
id = "google-oauth-client-secret"
name = "Google OAuth Client Secret"
provider = "Google"
category = "auth"
regex = '\bGOCSPX-[A-Za-z0-9_-]{28}\b'
confidence = "high"
severity = "high"
url = "https://console.cloud.google.com/apis/credentials"

# ── C3, second wave (2026-11-08) ─────────────────────────────────────────────
# Each prefix checked against the provider's own documentation, or a first-party
# statement where there is no page (Atlassian), as the inclusion rule above requires.

# GitLab's token overview lists `glrt-` for runner authentication tokens (16.0+), which replace
# registration tokens. The routable form (`glrt-t1_…`) starts the same way. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "gitlab-runner-token"
name = "GitLab Runner Authentication Token"
provider = "GitLab"
category = "source-ci"
regex = '\bglrt-[A-Za-z0-9_-]{20,}'
confidence = "high"
severity = "high"
url = "https://docs.gitlab.com/ci/runners/runners_scope/"

# `gldt-`, GitLab 16.7 and later (token overview). Clones and pushes registry images. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "gitlab-deploy-token"
name = "GitLab Deploy Token"
provider = "GitLab"
category = "source-ci"
regex = '\bgldt-[A-Za-z0-9_-]{20,}'
confidence = "high"
severity = "high"
url = "https://docs.gitlab.com/user/project/deploy_tokens/"

# `glptt-` plus 40 hex (token overview). Starts pipelines with the trigger owner's rights. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "gitlab-trigger-token"
name = "GitLab Pipeline Trigger Token"
provider = "GitLab"
category = "source-ci"
regex = '\bglptt-[0-9a-f]{40}\b'
confidence = "high"
severity = "high"
url = "https://docs.gitlab.com/ci/triggers/"

# Every Groq key starts `gsk_` and has full API access: no scoped keys exist. Billing, so critical.
[[rules]]
id = "groq-api-key"
name = "Groq API Key"
provider = "Groq"
category = "ai"
regex = '\bgsk_[A-Za-z0-9]{48,}\b'
confidence = "high"
severity = "critical"
url = "https://console.groq.com/keys"

# xAI (Grok) keys start `xai-`. The length is not published; 40+ keeps out short identifiers.
# Not Groq: that is `gsk_`.
[[rules]]
id = "xai-api-key"
name = "xAI API Key"
provider = "xAI"
category = "ai"
regex = '\bxai-[A-Za-z0-9]{40,}\b'
confidence = "high"
severity = "critical"
url = "https://console.x.ai"

# Replicate: "40-character strings that always start with `r8_`" (replicate.com/docs, API tokens).
[[rules]]
id = "replicate-api-token"
name = "Replicate API Token"
provider = "Replicate"
category = "ai"
regex = '\br8_[A-Za-z0-9]{37}\b'
confidence = "high"
severity = "critical"
url = "https://replicate.com/account/api-tokens"

# `pplx-` plus 48. Prepaid credits, so a leak drains the balance. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "perplexity-api-key"
name = "Perplexity API Key"
provider = "Perplexity"
category = "ai"
regex = '\bpplx-[A-Za-z0-9]{48}\b'
confidence = "high"
severity = "critical"
url = "https://www.perplexity.ai/account/api/keys"

# `whsec_`, Stripe's endpoint signing secret; Standard Webhooks providers use the same prefix.
# With it, anyone can forge events your endpoint accepts as Stripe's.
[[rules]]
id = "stripe-webhook-secret"
name = "Stripe Webhook Signing Secret"
provider = "Stripe"
category = "payments"
regex = '\bwhsec_[A-Za-z0-9+/]{32,}'
confidence = "high"
severity = "high"
url = "https://dashboard.stripe.com/webhooks"

# `dapi` plus 32 hex (Databricks' format, as AWS Secrets Manager's partner rotation documents it).
# Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "databricks-token"
name = "Databricks Personal Access Token"
provider = "Databricks"
category = "databases-backends"
regex = '\bdapi[a-f0-9]{32}(?:-[0-9])?\b'
confidence = "high"
severity = "high"
url = "https://docs.databricks.com/admin/access-control/tokens.html"

# Atlassian (staff answer, 2025-08): API tokens start `ATAT`, access tokens `ATCT`; both carry the
# `TT3xFfG` header after it. Jira, Confluence and Bitbucket Cloud.
[[rules]]
id = "atlassian-api-token"
name = "Atlassian API Token"
provider = "Atlassian"
category = "saas"
regex = '\bAT[AC]TT3xFfG[A-Za-z0-9_=-]{100,}'
confidence = "high"
severity = "high"
url = "https://id.atlassian.com/manage-profile/security/api-tokens"

# Atlassian (staff answer, 2025-08): Bitbucket app passwords start `ATBB`. Medium confidence: four
# capitals are a short prefix.
[[rules]]
id = "bitbucket-app-password"
name = "Bitbucket App Password"
provider = "Bitbucket"
category = "source-ci"
regex = '\bATBB[A-Za-z0-9]{28,}\b'
confidence = "medium"
severity = "high"
url = "https://bitbucket.org/account/settings/app-passwords/"

# HCP Terraform (Terraform Cloud) user, team and organisation tokens: 14 characters, `.atlasv1.`, then
# the secret. Runs plans and applies against real infrastructure. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "terraform-cloud-token"
name = "HCP Terraform API Token"
provider = "HashiCorp"
category = "infra-secrets"
regex = '\b[A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_=-]{60,70}'
confidence = "high"
severity = "critical"
url = "https://app.terraform.io/app/settings/tokens"

# Pulumi's API docs: token values are "prefixed with `pul-`" (personal, team and organisation).
# Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "pulumi-access-token"
name = "Pulumi Access Token"
provider = "Pulumi"
category = "infra-secrets"
regex = '\bpul-[a-f0-9]{40}\b'
confidence = "high"
severity = "critical"
url = "https://app.pulumi.com/account/tokens"

# Doppler: service tokens `dp.st.<config>.`, personal `dp.pt.`, CLI `dp.ct.`, service accounts
# `dp.sa.` (docs.doppler.com, Service Tokens). Each reads a secrets manager.
[[rules]]
id = "doppler-token"
name = "Doppler Token"
provider = "Doppler"
category = "infra-secrets"
regex = '\bdp\.(?:st|pt|ct|sa)\.(?:[A-Za-z0-9_-]{1,64}\.)?[A-Za-z0-9]{40,}'
confidence = "high"
severity = "critical"
url = "https://dashboard.doppler.com"

# `sbp_` (scoped ones `sbp_fc`): the Management API, every project the account can reach.
[[rules]]
id = "supabase-access-token"
name = "Supabase Personal Access Token"
provider = "Supabase"
category = "databases-backends"
regex = '\bsbp_[A-Za-z0-9]{40,}\b'
confidence = "high"
severity = "critical"
url = "https://supabase.com/dashboard/account/tokens"

# `sb_secret_`, which replaces the `service_role` JWT and bypasses Row Level Security (supabase.com
# API keys). Its partner `sb_publishable_` is meant to be public and has no rule.
[[rules]]
id = "supabase-secret-key"
name = "Supabase Secret Key"
provider = "Supabase"
category = "databases-backends"
regex = '\bsb_secret_[A-Za-z0-9_-]{20,}'
confidence = "high"
severity = "critical"
url = "https://supabase.com/dashboard/project/_/settings/api-keys"

# The age file-encryption secret key: Bech32, HRP `AGE-SECRET-KEY-`, 58 data characters (age spec).
# It decrypts every file encrypted to its public key. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "age-secret-key"
name = "age Secret Key"
provider = "age"
category = "keys-certificates"
regex = 'AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'
confidence = "high"
severity = "critical"

# User keys start `NRAK-` (AWS's New Relic integration pins `NRAK-[A-Z0-9]+`); NerdGraph with the
# user's rights. Ingest and licence keys (`NRII`, `NRAL`) are not this rule.
[[rules]]
id = "new-relic-user-key"
name = "New Relic User API Key"
provider = "New Relic"
category = "observability"
regex = '\bNRAK-[A-Z0-9]{27}\b'
confidence = "high"
severity = "high"
url = "https://one.newrelic.com/api-keys"

# `glsa_`, 32 characters, `_`, an 8-hex checksum (Grafana docs, gcx authentication). Cloud and
# self-managed. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "grafana-service-account-token"
name = "Grafana Service Account Token"
provider = "Grafana"
category = "observability"
regex = '\bglsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}\b'
confidence = "high"
severity = "high"

# `glc_` then base64 (Grafana docs). Manages stacks and data across a Grafana Cloud org. Adapted
# from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "grafana-cloud-token"
name = "Grafana Cloud Access Policy Token"
provider = "Grafana"
category = "observability"
regex = '\bglc_[A-Za-z0-9+/]{32,400}'
confidence = "high"
severity = "high"
url = "https://grafana.com/orgs"

# `PMAK-`, 24 hex, `-`, 34 hex. Every collection, environment and workspace the user can see,
# environments often holding other secrets. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "postman-api-key"
name = "Postman API Key"
provider = "Postman"
category = "saas"
regex = '\bPMAK-[a-f0-9]{24}-[a-f0-9]{34}\b'
confidence = "high"
severity = "high"
url = "https://go.postman.co/settings/me/api-keys"

# `ntn_`, 11 digits, then 35 characters. The legacy `secret_` form has no rule: that prefix is an
# ordinary word. Adapted from gitleaks (MIT, github.com/gitleaks/gitleaks)
[[rules]]
id = "notion-token"
name = "Notion Integration Token"
provider = "Notion"
category = "saas"
regex = '\bntn_[0-9]{11}[A-Za-z0-9]{35}\b'
confidence = "high"
severity = "high"
url = "https://www.notion.so/my-integrations"
