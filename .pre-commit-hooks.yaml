# ⛔ `pass_filenames: true`, not `false` with `always_run`.
#
# This hook used to run `evnx scan` with no arguments, so it scanned the whole
# working tree on every commit — including the real, gitignored `.env` that a
# developer necessarily has. A scan finds the secrets in it, exits 1, and the
# commit is blocked. **Every commit**, for anyone with a working local setup,
# over a file that was never going to be committed.
#
# A pre-commit hook's job is to check what is **being committed**. pre-commit
# passes the staged paths, and a gitignored `.env` is never staged — so the
# obstruction disappears without losing any real coverage.
#
# ⓘ No `files:` filter on purpose. `scan`'s detectors are content-based and
# already find secrets in `.py`, `.yml`, `.md` and the rest, so narrowing this
# to `.env*` would lose the case where a key is pasted into source. `scan`
# ignores paths it cannot usefully read.
- id: evnx-scan
  name: evnx — Secret Scanner
  description: Scan staged files for accidentally committed secrets (AWS keys, Stripe, OpenAI, etc.)
  entry: evnx scan
  language: rust
  pass_filenames: true
  stages: [pre-commit]

- id: evnx-validate
  name: evnx — .env Validator
  description: Validate .env files for placeholders, weak secrets, and misconfigurations
  entry: evnx validate --strict
  language: rust
  pass_filenames: false
  stages: [pre-commit]
  files: \.env$|\.env\.\w+$

- id: evnx-diff
  name: evnx — .env Drift Check
  description: Ensure .env and .env.example are in sync
  entry: evnx diff
  language: rust
  pass_filenames: false
  stages: [pre-commit]

- id: evnx-doctor
  name: evnx — Setup Doctor
  description: Check .gitignore includes .env and file permissions are safe
  entry: evnx doctor
  language: rust
  pass_filenames: false
  stages: [pre-commit]

# ⛔ `--check`, not a sync that writes (I-128, DEC-S15).
#
# This ran `evnx sync --direction forward --placeholder`. pre-commit gives a
# hook no terminal, so on any drift sync's prompt failed with "not a
# terminal" (exit 2) and the commit was blocked with no hint; and on a clone
# with no `.env` — every new contributor — it failed "file not found". It also
# described itself as "scrubs values, keeps keys", which sync does not do.
#
# `--check` needs no terminal and names the command that fixes the drift.
# `--skip-without-env` lets a fresh clone commit: with no `.env` and no
# `[vars]` spec there is nothing to compare, and the hook says it skipped. A
# spec, when there is one, is still checked (DEC-S4).
- id: evnx-sync
  name: evnx — .env.example up to date
  description: Fail the commit when .env has variables .env.example does not declare (skipped with no .env)
  entry: evnx sync --check --skip-without-env
  language: rust
  pass_filenames: false
  stages: [pre-commit]

# Optional: the writing variant. Adds missing variables to .env.example with
# placeholder values — never real ones; `allow_actual` in a template config is
# the only way a real value gets there, and it refuses credentials. pre-commit
# fails a hook that changes a file, so the commit stops once: stage the updated
# template and commit again.
- id: evnx-sync-fix
  name: evnx — Add missing names to .env.example
  description: Add variables missing from .env.example, with placeholder values (skipped with no .env)
  entry: evnx sync --force --skip-without-env
  language: rust
  pass_filenames: false
  stages: [pre-commit]

# Pre-push variant (heavier checks)
# ⚠️ Same change, same reason. At pre-push the question is what is about to be
# published, not what happens to be on disk — and the working tree still holds
# the gitignored `.env` that blocked every commit above.
- id: evnx-scan-push
  name: evnx — Strict Secret Scanner (pre-push)
  description: Strict secret scan with SARIF output before push
  entry: evnx scan --format sarif
  language: rust
  pass_filenames: true
  stages: [pre-push]