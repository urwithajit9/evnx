name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # ⚠️ One target must not cancel the rest. With the default `fail-fast`,
      # the Windows failure above cancelled all six other builds, so a tag that
      # broke on one platform told us nothing about the other six — and the
      # release can only be exercised by tagging. Maximum information per
      # attempt matters more here than saving runner minutes.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Added for the container image: arm64 Linux needs a *static* binary
          # to run on Alpine, and the gnu build above is dynamically linked.
          # It also gives arm64 Linux users a musl tarball, which they did not
          # have before.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Configure linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # ⚠️ `musl-tools` provides `musl-gcc` for **x86_64 only**. It does not
      # provide `aarch64-linux-musl-gcc`, and `ring` — pulled in by rustls via
      # reqwest, so present in every `--all-features` build — runs a build
      # script that needs a C compiler for the target. v0.5.0's tag failed here:
      #
      #   error occurred in cc-rs: failed to find tool "aarch64-linux-musl-gcc"
      #
      # and because every other job in this file `needs:` the build, one target
      # took the GitHub Release, the container image, Homebrew, Scoop, winget
      # and npm down with it.
      #
      # `cross` runs the build in a container that already has the toolchain,
      # which is less brittle than fetching one from a third-party host.
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --all-features --target ${{ matrix.target }}

      # ⚠️ Two steps with `if:`, never one step with a shell conditional. The
      # first attempt at this branched inside `run:` with bash, and the Windows
      # runner defaults to PowerShell:
      #
      #   ParserError: Missing '(' after 'if' in if statement.
      #
      # It failed the Windows target, and `fail-fast` then cancelled the other
      # six — so the tag produced no binaries at all. The Package step below has
      # carried `shell: bash` for exactly this reason. A GitHub `if:` expression
      # needs no shell, so it cannot regress this way on any runner.
      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_DIR: "/usr"
          PKG_CONFIG_ALLOW_CROSS: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BINARY="evnx"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BINARY="evnx.exe"
          fi
          cp target/${{ matrix.target }}/release/$BINARY dist/evnx-${{ matrix.target }}${BINARY##evnx}
          cd dist

          # Create tar.gz for all targets
          tar -czf evnx-${{ matrix.target }}.tar.gz evnx-${{ matrix.target }}${BINARY##evnx}
          sha256sum evnx-${{ matrix.target }}.tar.gz > evnx-${{ matrix.target }}.tar.gz.sha256

          # Create ZIP for Windows (required by Scoop and Winget)
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            if command -v powershell &> /dev/null; then
              powershell -Command "Compress-Archive -Path 'evnx-${{ matrix.target }}${BINARY##evnx}' -DestinationPath 'evnx-${{ matrix.target }}.zip' -Force"
            else
              zip -q evnx-${{ matrix.target }}.zip evnx-${{ matrix.target }}${BINARY##evnx} 2>/dev/null || echo "ZIP creation skipped"
            fi
            sha256sum evnx-${{ matrix.target }}.zip > evnx-${{ matrix.target }}.zip.sha256 2>/dev/null || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evnx-${{ matrix.target }}
          path: dist/*
          retention-days: 5

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release-assets
          find artifacts -name "*.tar.gz*" -exec cp {} release-assets/ \;
          find artifacts -name "*.zip*"    -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets/

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"

          # ⚠️ The release body used to be installation instructions and nothing
          # else, so anything written *about* a release never reached the page
          # people actually land on. `docs/releases/v0.5.0.md` carried a notice
          # telling anyone who had run `evnx validate --fix` to rotate the secret
          # it generated — 25 bits of time rather than randomness, announced as
          # "Generated secure secret" — and nothing published it. The body is
          # built here, and this step read no file. The notice went unread across
          # three releases.
          #
          # The CHANGELOG is now the single source of truth for what a release
          # says: everything between `## [VERSION]` and the next `## [` heading is
          # lifted verbatim, and it goes **above** the installation instructions,
          # because a reader who needs to rotate a credential should not have to
          # scroll past seven package managers to find out.
          #
          # String matching rather than a regex, so a version containing `.` is
          # compared literally and there is no escaping to get wrong.
          if awk -v v="$VERSION" '
                index($0, "## [" v "]") == 1 { f = 1; next }
                f && index($0, "## [") == 1  { exit }
                f                            { print }
              ' CHANGELOG.md > changelog_section.md && [ -s changelog_section.md ]; then
            echo "using the CHANGELOG section for $VERSION"
          else
            # ⚠️ A warning, not a failure. A missing heading must not block a
            # release that is otherwise ready, and the install instructions on
            # their own are still a usable body — which is what every release
            # before this one shipped.
            echo "::warning::no CHANGELOG section for $VERSION — the release body will carry installation instructions only"
            : > changelog_section.md
          fi

          { printf '# evnx v%s\n\n' "$VERSION"; cat changelog_section.md; } > release_notes.md

          cat >> release_notes.md << EOF

          ## Installation

          ### Linux / macOS (shell script)
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          \`\`\`

          ### Homebrew (macOS and Linux)
          \`\`\`bash
          brew install urwithajit9/evnx/evnx
          \`\`\`

          ### Scoop (Windows, user-local)
          \`\`\`powershell
          scoop bucket add evnx https://github.com/urwithajit9/scoop-evnx
          scoop install evnx
          \`\`\`

          ### Winget (Windows, system-wide)
          \`\`\`powershell
          winget install urwithajit9.evnx
          \`\`\`

          ### npm / Node.js
          \`\`\`bash
          npm install -g @evnx/cli
          \`\`\`

          ### Python (pipx)
          \`\`\`bash
          pipx install evnx
          \`\`\`

          ### Cargo
          \`\`\`bash
          cargo install evnx --all-features
          \`\`\`
          > \`cargo install\` compiles from source with \`default = []\`, so plain
          > \`cargo install evnx\` gives you a binary **without** the \`auth\`,
          > \`vault\` and \`cloud\` commands. Every other channel above ships them
          > already — the binaries are built with \`--all-features\`.

          ## Checksums

          SHA256 checksums are provided for each binary. Verify after download:
          \`\`\`bash
          sha256sum -c evnx-*.tar.gz.sha256
          \`\`\`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Container image ────────────────────────────────────────────────────────
  #
  # ⚠️ This does NOT build evnx. It packages the same static musl binaries the
  # matrix above already produced, so `docker run evnx --version` and a
  # downloaded tarball are byte for byte the same program. Building here would
  # mean two toolchains and two sets of flags to keep honest — the same reason
  # evnx-server's image is built in CI and never on the box.
  docker:
    name: Publish container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download the static binaries
        uses: actions/download-artifact@v4
        with:
          pattern: evnx-*-unknown-linux-musl
          path: musl

      - name: Lay out one binary per architecture
        run: |
          set -euo pipefail
          cp musl/evnx-x86_64-unknown-linux-musl/evnx-x86_64-unknown-linux-musl  evnx-bin-amd64
          cp musl/evnx-aarch64-unknown-linux-musl/evnx-aarch64-unknown-linux-musl evnx-bin-arm64
          chmod +x evnx-bin-amd64 evnx-bin-arm64
          file evnx-bin-amd64 evnx-bin-arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile COPYs `evnx-bin-${TARGETARCH}`, which buildx sets per
      # platform, so one build produces both images under one manifest.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/urwithajit9/evnx:${{ steps.version.outputs.VERSION }}
            ghcr.io/urwithajit9/evnx:latest
          provenance: true
          sbom: true

  # ── Update Homebrew tap ────────────────────────────────────────────────────
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Fetch SHA256 values from release assets
        id: sha256
        run: |
          # Same reason as the Scoop job's fetch step: without pipefail the exit
          # status of `curl | awk` is awk's, so a 404 yields an empty SHA and a
          # green step — and the formula is then published with `sha256 ""`.
          set -o pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}"

          SHA_AARCH64_DARWIN=$(curl -fsSL "${BASE}/evnx-aarch64-apple-darwin.tar.gz.sha256" | awk '{print $1}')
          SHA_X86_64_DARWIN=$(curl -fsSL "${BASE}/evnx-x86_64-apple-darwin.tar.gz.sha256" | awk '{print $1}')
          SHA_AARCH64_LINUX=$(curl -fsSL "${BASE}/evnx-aarch64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          SHA_X86_64_LINUX=$(curl -fsSL "${BASE}/evnx-x86_64-unknown-linux-musl.tar.gz.sha256" | awk '{print $1}')

          echo "aarch64_darwin=$SHA_AARCH64_DARWIN" >> $GITHUB_OUTPUT
          echo "x86_64_darwin=$SHA_X86_64_DARWIN" >> $GITHUB_OUTPUT
          echo "aarch64_linux=$SHA_AARCH64_LINUX" >> $GITHUB_OUTPUT
          echo "x86_64_linux=$SHA_X86_64_LINUX" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: urwithajit9/homebrew-evnx
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-evnx

      - name: Update Formula
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p homebrew-evnx/Formula

          cat > homebrew-evnx/Formula/evnx.rb << EOF
          class Evnx < Formula
            desc "Manage .env files — validate, scan for secrets, convert formats, and sync them end-to-end encrypted"
            homepage "https://www.evnx.dev"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/urwithajit9/evnx/releases/download/v#{version}/evnx-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha256.outputs.aarch64_darwin }}"
              end
              on_intel do
                url "https://github.com/urwithajit9/evnx/releases/download/v#{version}/evnx-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.sha256.outputs.x86_64_darwin }}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/urwithajit9/evnx/releases/download/v#{version}/evnx-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.sha256.outputs.aarch64_linux }}"
              end
              on_intel do
                url "https://github.com/urwithajit9/evnx/releases/download/v#{version}/evnx-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${{ steps.sha256.outputs.x86_64_linux }}"
              end
            end

            def install
              on_macos do
                on_arm   { bin.install "evnx-aarch64-apple-darwin" => "evnx" }
                on_intel { bin.install "evnx-x86_64-apple-darwin"  => "evnx" }
              end
              on_linux do
                on_arm   { bin.install "evnx-aarch64-unknown-linux-gnu"  => "evnx" }
                on_intel { bin.install "evnx-x86_64-unknown-linux-musl"  => "evnx" }
              end
            end

            def caveats
              <<~EOS
                Run 'evnx --help' to get started.
                Documentation: https://docs.evnx.dev/cli
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/evnx --version")
            end
          end
          EOF

      # ── The gate the Scoop job already has ───────────────────────────────
      #
      # D8 shipped an invalid Scoop manifest on every release for five releases
      # because nothing between the heredoc and `git push` ever looked at the
      # result. This job has the same shape — a heredoc, then a push — and had the
      # same gap. Filed as D14 when the Scoop one was fixed.
      #
      # ⚠️ A Homebrew formula is Ruby, so a syntax error is not a parse warning at
      # install time: `brew install evnx` fails outright for everyone on macOS until
      # the next release. `ruby -c` costs nothing and catches it here.
      - name: Validate the formula before publishing it
        run: |
          set -o pipefail
          FORMULA=homebrew-evnx/Formula/evnx.rb
          fail() { echo "::error file=${FORMULA}::$1"; exit 1; }

          ruby -c "$FORMULA" > /dev/null || fail "not valid Ruby"

          # ⚠️ Catches an empty SHA from the fetch step, which without pipefail used
          # to be a green step and a formula nobody could install: Homebrew compares
          # the checksum and refuses on a mismatch, and "" matches nothing.
          empty=$(grep -c 'sha256 ""' "$FORMULA" || true)
          [ "$empty" -eq 0 ] || fail "$empty sha256 field(s) are empty"

          # Every sha256 present must actually be a digest rather than something
          # shaped like one.
          while read -r digest; do
            printf '%s' "$digest" | grep -Eq '^[a-f0-9]{64}$' \
              || fail "sha256 $digest is not 64 hex characters"
          done < <(grep -oE 'sha256 "[a-f0-9]*"' "$FORMULA" | sed 's/sha256 "//; s/"//')

          GOT_VERSION=$(grep -oE 'version "[^"]+"' "$FORMULA" | head -1 | sed 's/version "//; s/"//')
          [ "$GOT_VERSION" = "${{ steps.version.outputs.VERSION }}" ] \
            || fail "version is '${GOT_VERSION}', expected '${{ steps.version.outputs.VERSION }}'"

          echo "formula ok — v${GOT_VERSION}, $(grep -c 'sha256 "' "$FORMULA") checksums"

      - name: Commit and push Formula update
        run: |
          cd homebrew-evnx
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/evnx.rb
          git diff --staged --quiet || git commit -m "chore: update evnx to v${{ steps.version.outputs.VERSION }}"
          git push

  # ── Update Scoop bucket ────────────────────────────────────────────────────
  # This job is intentionally part of release.yml rather than a separate
  # scoop-update.yml workflow. A GitHub Release created by GITHUB_TOKEN inside
  # a workflow does not fire the `release: published` event for other workflows,
  # so a standalone scoop-update.yml triggered by that event would never run.
  update-scoop-bucket:
    name: Update Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Fetch ZIP SHA256 from release assets
        id: sha256
        run: |
          # ⚠️ pipefail matters here. This workflow declares no `defaults.run.shell`,
          # so steps get `bash -e` WITHOUT it, and the exit status of
          # `curl | awk` is awk's. A 404 or a network failure would leave SHA
          # empty, the step would still succeed, and the manifest would be
          # published with "hash": "sha256:" — which every install then fails on.
          set -o pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}"
          SHA=$(curl -fsSL "${BASE}/evnx-x86_64-pc-windows-msvc.zip.sha256" | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Checkout Scoop bucket
        uses: actions/checkout@v4
        with:
          repository: urwithajit9/scoop-evnx
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA="${{ steps.sha256.outputs.sha }}"
          mkdir -p scoop-bucket/bucket

          # The architecture.url uses ${VERSION} — the actual version number
          # substituted by this shell step (e.g. "0.3.6").
          # The autoupdate.url uses \$version — a literal "$version" string
          # written into the JSON file so Scoop can use it as its own template
          # variable for future auto-updates via `scoop update`.
          #
          # ⚠️ The heredoc below is UNQUOTED — it has to be, or ${VERSION} and
          # ${SHA} would not substitute. That means the shell also eats one level
          # of backslash on the way to the file, and a JSON string needs a
          # backslash of its own to carry a literal one. So a regex `\s` must be
          # written here as FOUR backslashes:
          #
          #     \\\\s  →  (shell)  →  \\s  →  (JSON)  →  \s
          #
          # It was written as two until D8, which reached the file as `\s` — not
          # a JSON escape sequence, so the manifest was not valid JSON. It
          # shipped that way on every release from e96bdb4 to 0.6.0 because
          # nothing parsed the result. The step after this one now does.
          cat > scoop-bucket/bucket/evnx.json << EOF
          {
            "version": "${VERSION}",
            "description": "Manage .env files — validate, scan for secrets, convert formats, and sync them end-to-end encrypted",
            "homepage": "https://www.evnx.dev",
            "license": "MIT",
            "notes": "Run 'evnx --help' to get started. Docs: https://docs.evnx.dev/cli",
            "architecture": {
              "64bit": {
                "url": "https://github.com/urwithajit9/evnx/releases/download/v${VERSION}/evnx-x86_64-pc-windows-msvc.zip",
                "hash": "sha256:${SHA}",
                "bin": [["evnx-x86_64-pc-windows-msvc.exe", "evnx"]]
              }
            },
            "checkver": { "github": "https://github.com/urwithajit9/evnx" },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/urwithajit9/evnx/releases/download/v\$version/evnx-x86_64-pc-windows-msvc.zip",
                  "hash": { "url": "\$url.sha256", "find": "^([a-f0-9]+)\\\\s" }
                }
              }
            }
          }
          EOF

      # ── The gate that was missing ────────────────────────────────────────
      # D8 shipped an invalid manifest on every release from e96bdb4 to 0.6.0,
      # and the reason it survived that long is that nothing between the heredoc
      # and `git push` ever looked at the result.
      #
      # Scoop reads a manifest with `ConvertFrom-Json -ErrorAction Stop` and, when
      # that throws, warns and returns $null (ScoopInstaller/Scoop lib/manifest.ps1,
      # `parse_json`). So a malformed manifest is not a degraded install — there is
      # no manifest at all.
      - name: Validate the manifest before publishing it
        run: |
          set -o pipefail
          MANIFEST=scoop-bucket/bucket/evnx.json
          fail() { echo "::error file=${MANIFEST}::$1"; exit 1; }

          jq empty "$MANIFEST" || fail "not valid JSON"

          # Assert the DECODED value, not merely that the file parses. Too many
          # backslashes also parses — it just means something different.
          FIND=$(jq -r '.autoupdate.architecture."64bit".hash.find' "$MANIFEST")
          [ "$FIND" = '^([a-f0-9]+)\s' ] \
            || fail "autoupdate hash.find is '${FIND}', expected '^([a-f0-9]+)\s'"

          # Catches an empty SHA from the fetch step, which would otherwise be
          # published as a well-formed manifest that no install can satisfy.
          HASH=$(jq -r '.architecture."64bit".hash' "$MANIFEST")
          printf '%s' "$HASH" | grep -Eq '^sha256:[a-f0-9]{64}$' \
            || fail "hash is '${HASH}', expected sha256:<64 hex>"

          GOT_VERSION=$(jq -r .version "$MANIFEST")
          [ "$GOT_VERSION" = "${{ steps.version.outputs.VERSION }}" ] \
            || fail "version is '${GOT_VERSION}', expected '${{ steps.version.outputs.VERSION }}'"

          echo "manifest ok — v${GOT_VERSION}, ${HASH}"

      - name: Commit and push
        run: |
          cd scoop-bucket
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/evnx.json
          git diff --staged --quiet || git commit -m "chore: update evnx to v${{ steps.version.outputs.VERSION }}"
          git push

  # ── Publish to Winget ──────────────────────────────────────────────────────
  # Same reasoning as update-scoop-bucket: runs here rather than in a separate
  # winget-publish.yml to avoid the GITHUB_TOKEN cascade trigger limitation.
  publish-winget:
    name: Publish to Winget
    needs: release
    runs-on: windows-latest
    steps:
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download wingetcreate
        run: Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installerUrl = "https://github.com/urwithajit9/evnx/releases/download/v$version/evnx-x86_64-pc-windows-msvc.zip"

          # FIRST SUBMISSION: creates the package entry in winget-pkgs for the
