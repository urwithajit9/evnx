name: CI

on:
  push:
    # `feat/**` so the long-lived cloud branch is actually checked. Without it CI
    # runs only on main, and the whole cloud feature would land unverified.
    #
    # `fix/**` added 2026-09-21: every branch in the v0.5.0 command-review release
    # was named `fix/…`, so none of them got CI on push — only once a PR opened.
    # Not a hole, but the signal arrived later than intended, and a branch pushed
    # without a PR got nothing at all.
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, 'feat/**', 'fix/**' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Run tests
        run: cargo test --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings

  benches:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ⚠️ `--no-run` builds them and stops. Benchmark *timings* from a shared
      # runner are noise — neighbours on the box move them more than a code change
      # does — so measuring here would produce numbers nobody could act on.
      #
      # What this catches is the failure benches actually had: `cli_benchmarks.rs`
      # referenced `dotenv_space`, the crate's pre-rename name, and `criterion` was
      # never declared. It sat broken across the rename and a `HashMap`→`IndexMap`
      # change because nothing in CI built it: `cargo test` skips benches, and the
      # clippy step runs `--all-features` without `--all-targets`.
      - run: cargo bench --all-features --no-run

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI had no audit job until 2026-09-14, so four live advisories in
      # rustls-webpki — the TLS stack the cloud feature talks to the API over,
      # including two certificate name-constraint bypasses — sat unnoticed in the
      # lockfile. Documented exceptions live in .cargo/audit.toml.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  package:
    name: crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ⚠️ Publishing to crates.io is manual and irreversible — a version can be
      # yanked but never unpublished, and the number can never be reused. So the
      # failure mode worth preventing is discovering a packaging problem *during*
      # the release.
      #
      # `--dry-run` packages the crate and builds it from the resulting tarball,
      # which contains only the files `cargo package` includes. A file that is
      # gitignored, or excluded by `[package] include`, compiles locally and
      # fails here — which is the whole point of running it on every PR rather
      # than once at the tag.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features