name: CI

on:
  push:
    # `feat/**` so the long-lived cloud branch is actually checked. Without it CI
    # runs only on main, and the whole cloud feature would land unverified.
    #
    # `fix/**` added 2026-09-21: every branch in the v0.5.0 command-review release
    # was named `fix/…`, so none of them got CI on push — only once a PR opened.
    # Not a hole, but the signal arrived later than intended, and a branch pushed
    # without a PR got nothing at all.
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, 'feat/**', 'fix/**' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Run tests
        run: cargo test --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ⚠️ `--all-targets` includes tests and benches, which this did not lint
      # until v0.5.0. The debt it hid was small — a deprecated API, some style
      # lints — but the reason to close it is that a test file is where a
      # `Command::cargo_bin` that stops working, or an `Assert` whose result is
      # dropped, goes unnoticed. A dropped `Assert` asserts nothing.
      - run: cargo clippy --all-features --all-targets -- -D warnings

      # ⚠️ Default features too. `cargo install evnx` — the canonical install
      # path — builds with `default = []`, and CI linted only `--all-features`,
      # so that configuration went unchecked. It had accumulated six unused
      # imports and two clippy errors by v0.5.0, none of them visible here.
      - run: cargo clippy --all-targets -- -D warnings

  benches:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ⚠️ `--no-run` builds them and stops. Benchmark *timings* from a shared
      # runner are noise — neighbours on the box move them more than a code change
      # does — so measuring here would produce numbers nobody could act on.
      #
      # What this catches is the failure benches actually had: `cli_benchmarks.rs`
      # referenced `dotenv_space`, the crate's pre-rename name, and `criterion` was
      # never declared. It sat broken across the rename and a `HashMap`→`IndexMap`
      # change because nothing in CI built it: `cargo test` skips benches, and the
      # clippy step runs `--all-features` without `--all-targets`.
      - run: cargo bench --all-features --no-run

  # ⚠️ CI built **none** of release.yml's seven targets until v0.5.0, so a
  # target that could not compile was discoverable only by pushing a tag — and
  # at that point every job in release.yml `needs:` the build, so one broken
  # target took the GitHub Release, the container image, Homebrew, Scoop, winget
  # and npm with it. That is exactly what happened to v0.5.0.
  #
  # Only the two musl targets are built here: they are the ones that cross-
  # compile with a C toolchain (`ring` needs one), which is where the breakage
  # was. The apple and windows targets need their own runners and are covered by
  # the release build itself.
  cross-targets:
    name: Release targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --all-features --target x86_64-unknown-linux-musl
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --all-features --target aarch64-unknown-linux-musl

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI had no audit job until 2026-09-14, so four live advisories in
      # rustls-webpki — the TLS stack the cloud feature talks to the API over,
      # including two certificate name-constraint bypasses — sat unnoticed in the
      # lockfile. Documented exceptions live in .cargo/audit.toml.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  package:
    name: crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ⚠️ Publishing to crates.io is manual and irreversible — a version can be
      # yanked but never unpublished, and the number can never be reused. So the
      # failure mode worth preventing is discovering a packaging problem *during*
      # the release.
      #
      # `--dry-run` packages the crate and builds it from the resulting tarball,
      # which contains only the files `cargo package` includes. A file that is
      # gitignored, or excluded by `[package] include`, compiles locally and
      # fails here — which is the whole point of running it on every PR rather
      # than once at the tag.
      # ⚠️ The crate must not carry environment files. `.env.backup` — a real
      # encrypted backup artifact — and `.envx/placeholders.json` were committed
      # in March 2026 and shipped to crates.io in 0.5.0, 0.5.1 and 0.5.2, because
      # this repository's own .gitignore used the narrow `.env`/`.env.local`
      # convention that `evnx init` had already moved away from.
      #
      # A published version cannot be altered, so the only thing left is making
      # sure it does not happen again. Checked before the dry run, so a failure
      # names the cause rather than surfacing as a packaging error.
      - name: no environment files in the crate
        run: |
          set -euo pipefail
          # ⚠️ The list is captured before it is searched, and cargo's exit
          # status is checked. Piping it straight into `grep` swallowed the
          # status, so `cargo package` failing for any reason — a dirty tree is
          # enough — produced an empty list that read as a clean one. A guard
          # that passes when it could not run is the bug it exists to catch.
          if ! files=$(cargo package --list --all-features); then
            echo "::error::cargo package --list failed; cannot verify the crate contents"
            exit 1
          fi
          if [ -z "$files" ]; then
            echo "::error::cargo package --list returned nothing; refusing to call that clean"
            exit 1
          fi
          leaked=$(printf '%s\n' "$files" | grep -E '^\.env|(^|/)\.envx/' || true)
          if [ -n "$leaked" ]; then
            echo "::error::these would ship to crates.io:"
            printf '%s\n' "$leaked"
            exit 1
          fi
          echo "checked $(printf '%s\n' "$files" | wc -l) packaged files; no .env* or .envx/"

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features