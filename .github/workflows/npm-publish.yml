name: Publish to npm

# Triggers automatically after release.yml completes on a v* tag push.
# Can also be triggered manually via workflow_dispatch to recover from failures
# without cutting a new release tag.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'release.yml run ID (the number in the Actions URL for that run)'
        required: true
      version:
        description: 'Version to publish without v prefix (e.g. 0.3.0)'
        required: true

permissions:
  contents: write
  id-token: write  # Required for npm provenance attestation

jobs:
  check:
    name: Check upstream success
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - name: Resolve trigger source
        id: check
        # ⚠️ EVERY untrusted value arrives as an environment variable, never as
        # `${{ }}` inside the script.
        #
        # `${{ }}` is substituted into the script TEXT before bash sees it, so a
        # value containing shell syntax becomes shell syntax. `head_branch` is a
        # ref name chosen by whoever pushed, and git permits `"` `$` `;` `|` `&`
        # and backticks in one — only whitespace is excluded. Verified: the
        # branch `v1.0.0";id>/tmp/pwned;"` is a legal ref, and the old
        #
        #     HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
        #
        # ran the `id` and then went on to report `version: 1.0.0`, so the
        # injection was silent. This job holds NPM_TOKEN and a write-scoped
        # GITHUB_TOKEN.
        env:
          EVENT_NAME:      ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ github.event.inputs.run_id }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          WR_PATH:         ${{ github.event.workflow_run.path }}
          WR_EVENT:        ${{ github.event.workflow_run.event }}
          WR_CONCLUSION:   ${{ github.event.workflow_run.conclusion }}
          WR_BRANCH:       ${{ github.event.workflow_run.head_branch }}
          WR_SHA:          ${{ github.event.workflow_run.head_sha }}
          WR_RUN_ID:       ${{ github.event.workflow_run.id }}
          WR_HEAD_REPO:    ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPO:       ${{ github.repository }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          ACTOR:           ${{ github.actor }}
        run: |
          set -euo pipefail

          # A version this workflow will write into six package.json files and
          # publish under. Pinned to semver so nothing else can reach npm.
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Triggered manually by $ACTOR"

            if [[ ! "$DISPATCH_VERSION" =~ $VERSION_RE ]]; then
              echo "::error::version '$DISPATCH_VERSION' is not a semver string"
              exit 1
            fi
            if [[ ! "$DISPATCH_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::run_id '$DISPATCH_RUN_ID' is not a number"
              exit 1
            fi

            # ⚠️ The run_id is typed by hand and decides which artifacts get
            # published. Confirm it is a SUCCESSFUL release.yml run in THIS
            # repository before trusting what it uploaded — a transposed digit
            # otherwise publishes whatever some other run happened to produce.
            RUN=$(gh api "repos/$THIS_REPO/actions/runs/$DISPATCH_RUN_ID" 2>/dev/null) || {
              echo "::error::no run $DISPATCH_RUN_ID in $THIS_REPO"; exit 1; }
            RUN_PATH=$(jq -r '.path' <<<"$RUN")
            RUN_CONC=$(jq -r '.conclusion' <<<"$RUN")
            if [[ "$RUN_PATH" != ".github/workflows/release.yml" ]]; then
              echo "::error::run $DISPATCH_RUN_ID is '$RUN_PATH', not release.yml"; exit 1
            fi
            if [[ "$RUN_CONC" != "success" ]]; then
              echo "::error::run $DISPATCH_RUN_ID concluded '$RUN_CONC'"; exit 1
            fi

            echo "should_run=true"                     >> "$GITHUB_OUTPUT"
            echo "version=$DISPATCH_VERSION"           >> "$GITHUB_OUTPUT"
            echo "run_id=$DISPATCH_RUN_ID"             >> "$GITHUB_OUTPUT"
            echo "Will publish $DISPATCH_VERSION from run $DISPATCH_RUN_ID"
            exit 0
          fi

          echo "Upstream: path=$WR_PATH event=$WR_EVENT ref=$WR_BRANCH sha=$WR_SHA"

          # ⚠️ `workflows: ["Release"]` matches by NAME, and a name is none of
          # unique, immutable, or confined to the default branch. Any workflow
          # file anywhere in the repo whose `name:` is `Release` fires this one
          # — and GitHub is explicit that "the workflow started by the
          # workflow_run event is able to access secrets and write tokens, even
          # if the previous workflow was not". The file path is the identity
          # that the trigger filter cannot express.
          if [[ "$WR_PATH" != ".github/workflows/release.yml" ]]; then
            echo "::error::triggered by '$WR_PATH', not .github/workflows/release.yml"
            exit 1
          fi

          if [[ "$WR_HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::upstream run belongs to '$WR_HEAD_REPO', not '$THIS_REPO'"
            exit 1
          fi

          if [[ "$WR_EVENT" != "push" ]]; then
            echo "::error::upstream run was triggered by '$WR_EVENT'; release.yml publishes on tag pushes only"
            exit 1
          fi

          # ⚠️ A failed upstream release is a FAILURE here, not a skip.
          #
          # `workflow_run` fires whatever the upstream concluded, and this used
          # to skip quietly — but a skipped job leaves the workflow **green**.
          # That is how v0.4.0 was believed published: release.yml failed, this
          # workflow fired, skipped, and reported a green check next to it. The
          # npm token had also expired, and npm answers an unauthorised publish
          # to an existing package with 404, so even the eventual real error
          # read like a missing package.
          #
          # Recovery is the workflow_dispatch input, which is why it exists.
          if [[ "$WR_CONCLUSION" != "success" ]]; then
            echo "::error::Release run for $WR_BRANCH concluded '$WR_CONCLUSION' — refusing to publish to npm"
            echo "Nothing was published. Fix the release, then re-run this workflow"
            echo "manually with run_id=$WR_RUN_ID and version=${WR_BRANCH#v}."
            exit 1
          fi

          # ⚠️ `head_branch` is the ref's SHORT NAME and nothing more — it reads
          # `v0.9.0` for the tag v0.9.0 and `v0.9.0` for a BRANCH called v0.9.0.
          # The old `^v[0-9]` test could not tell them apart, so pushing a branch
          # with a version-shaped name was enough to drive a publish. Ask the
          # refs API for a TAG specifically; a branch 404s here.
          if [[ ! "$WR_BRANCH" =~ ^v[0-9] ]]; then
            echo "::error::ref '$WR_BRANCH' is not version-shaped"
            exit 1
          fi

          REF=$(gh api "repos/$THIS_REPO/git/ref/tags/$WR_BRANCH" 2>/dev/null) || {
            echo "::error::no TAG named '$WR_BRANCH' — a branch with a version-shaped name does not release"
            exit 1; }

          OBJ_TYPE=$(jq -r '.object.type' <<<"$REF")
          OBJ_SHA=$(jq -r '.object.sha'  <<<"$REF")
          if [[ "$OBJ_TYPE" == "tag" ]]; then     # annotated: deref to the commit
            # `gh api` + `jq -r`, matching the lookup above rather than using
            # `--jq`. Uniform shape so both branches are exercised the same way
            # by the same harness — the mismatch hid this path from its test.
            TAG_OBJ=$(gh api "repos/$THIS_REPO/git/tags/$OBJ_SHA")
            OBJ_SHA=$(jq -r '.object.sha' <<<"$TAG_OBJ")
          fi

          # ⚠️ And it must still point where the build pointed. A tag that was
          # moved after release.yml ran would otherwise publish binaries built
          # from one commit under a tag that now names another.
          if [[ "$OBJ_SHA" != "$WR_SHA" ]]; then
            echo "::error::tag $WR_BRANCH points at $OBJ_SHA but the release run built $WR_SHA"
            exit 1
          fi

          VERSION="${WR_BRANCH#v}"
          if [[ ! "$VERSION" =~ $VERSION_RE ]]; then
            echo "::error::'$VERSION' is not a semver string"
            exit 1
          fi

          echo "should_run=true"      >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "run_id=$WR_RUN_ID"    >> "$GITHUB_OUTPUT"
          echo "✓ tag $WR_BRANCH → $OBJ_SHA, built by release.yml run $WR_RUN_ID"
          echo "Will publish version: $VERSION"

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.check.outputs.version }}
      RELEASE_RUN_ID: ${{ needs.check.outputs.run_id }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # ── Download artifacts from the release.yml run ─────────────────────────
      # Uses RELEASE_RUN_ID so both automatic and manual triggers point to the
      # correct release run regardless of how this workflow was invoked.
      # ⚠️ `name` is not optional here, even though every artifact in the run
      # used to be one we wanted. `docker/build-push-action` uploads a build
      # record of its own — `urwithajit9~evnx~BOLW5I.dockerbuild` — which is not
      # a plain zip, so the unfiltered download killed the v0.5.2 npm publish:
      #
      #   ==> Extracting: urwithajit9~evnx~BOLW5I.dockerbuild.zip
      #   Error: ADM-ZIP: Invalid or unsupported zip format. No END header found
      #
      # The binary artifacts are all `evnx-<target>`, so anchoring on that
      # prefix keeps this step independent of whatever other jobs choose to
      # upload later.
      - name: Download the binary artifacts
        uses: dawidd6/action-download-artifact@07ab29fd4a977ae4d2b275087cf67563dfdf0295 # v9
        with:
          run_id: ${{ env.RELEASE_RUN_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-artifacts/
          name: ^evnx-
          name_is_regexp: true

      - name: Show downloaded artifacts
        run: find downloaded-artifacts/ -type f | sort

      # ── Extract binaries from tarballs ─────────────────────────────────────
      - name: Extract binaries
        run: |
          mkdir -p extracted/

          declare -A ARTIFACT_MAP=(
            ["evnx-x86_64-unknown-linux-musl"]="evnx-linux-x64"
            ["evnx-aarch64-unknown-linux-gnu"]="evnx-linux-arm64"
            ["evnx-x86_64-apple-darwin"]="evnx-darwin-x64"
            ["evnx-aarch64-apple-darwin"]="evnx-darwin-arm64"
            ["evnx-x86_64-pc-windows-msvc"]="evnx-win32-x64"
          )

          for artifact_folder in "${!ARTIFACT_MAP[@]}"; do
            npm_name="${ARTIFACT_MAP[$artifact_folder]}"
            tarball="downloaded-artifacts/${artifact_folder}/${artifact_folder}.tar.gz"

            if [[ ! -f "$tarball" ]]; then
              echo "ERROR: Expected tarball not found: $tarball"
              echo "Contents of downloaded-artifacts/${artifact_folder}/:"
              ls -la "downloaded-artifacts/${artifact_folder}/" || true
              exit 1
            fi

            echo "Extracting $tarball → extracted/$npm_name"
            mkdir -p "extracted/$npm_name"
            tar -xzf "$tarball" -C "extracted/$npm_name/"

            echo "Extracted contents of extracted/$npm_name/:"
            ls -la "extracted/$npm_name/"

            if [[ "$npm_name" == *"win32"* ]]; then
              # Use find — robust regardless of what the binary is named inside the tarball
              EXE_FILE=$(find "extracted/$npm_name/" -maxdepth 1 -name "*.exe" | head -1)
              if [[ -z "$EXE_FILE" ]]; then
                echo "ERROR: No .exe found in extracted/$npm_name/ after extraction"
                exit 1
              fi
              echo "Found Windows binary: $EXE_FILE"
              mv "$EXE_FILE" "extracted/$npm_name/evnx.exe"
            else
              # Prefer exact artifact name, fall back to first non-dotfile
              BIN_FILE="extracted/$npm_name/${artifact_folder}"
              if [[ ! -f "$BIN_FILE" ]]; then
                BIN_FILE=$(find "extracted/$npm_name/" -maxdepth 1 -type f ! -name ".*" | head -1)
              fi
              if [[ -z "$BIN_FILE" ]]; then
                echo "ERROR: No binary found in extracted/$npm_name/ after extraction"
                exit 1
              fi
              echo "Found binary: $BIN_FILE"
              mv "$BIN_FILE" "extracted/$npm_name/evnx"
              chmod +x "extracted/$npm_name/evnx"
            fi
          done

          echo "All extracted binaries:"
          find extracted/ -type f | sort

      # ── Build platform package directory structure ─────────────────────────
      - name: Create platform package structures
        run: |
          PLATFORMS=(
            "evnx-linux-x64:linux:x64:evnx"
            "evnx-linux-arm64:linux:arm64:evnx"
            "evnx-darwin-x64:darwin:x64:evnx"
            "evnx-darwin-arm64:darwin:arm64:evnx"
            "evnx-win32-x64:win32:x64:evnx.exe"
          )

          for entry in "${PLATFORMS[@]}"; do
            IFS=':' read -r pkg_name os cpu binary <<< "$entry"
            pkg_dir="npm-publish/packages/$pkg_name"

            mkdir -p "$pkg_dir/bin"

            cp "extracted/$pkg_name/$binary" "$pkg_dir/bin/$binary"
            chmod +x "$pkg_dir/bin/$binary" || true

            cat > "$pkg_dir/package.json" << EOF
          {
            "name": "@evnx/$pkg_name",
            "version": "$VERSION",
            "description": "evnx CLI binary for $os/$cpu",
            "os": ["$os"],
            "cpu": ["$cpu"],
            "bin": {
              "evnx": "bin/$binary"
            },
            "files": ["bin/$binary", "README.md"],
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/urwithajit9/evnx.git"
            }
          }
          EOF

            echo "Created $pkg_dir"
          done

      # ── Create the main wrapper package ────────────────────────────────────
      - name: Create wrapper package
        run: |
          mkdir -p npm-publish/evnx/bin

          cat > npm-publish/evnx/install.js << 'INSTALLEOF'
          #!/usr/bin/env node
          "use strict";

          const fs   = require("fs");
          const path = require("path");

          const PLATFORM_PACKAGES = {
            "linux-x64":    "@evnx/evnx-linux-x64",
            "linux-arm64":  "@evnx/evnx-linux-arm64",
            "darwin-x64":   "@evnx/evnx-darwin-x64",
            "darwin-arm64": "@evnx/evnx-darwin-arm64",
            "win32-x64":    "@evnx/evnx-win32-x64",
          };

          function getBinaryPath() {
            const key = `${process.platform}-${process.arch}`;
            const pkg = PLATFORM_PACKAGES[key];

            if (!pkg) {
              throw new Error(
                `evnx: Unsupported platform: ${process.platform}/${process.arch}\n` +
                `Supported: ${Object.keys(PLATFORM_PACKAGES).join(", ")}\n` +
                `Install manually: https://github.com/urwithajit9/evnx/releases`
              );
            }

            let pkgJsonPath;
            try {
              pkgJsonPath = require.resolve(`${pkg}/package.json`);
            } catch (e) {
              throw new Error(
                `evnx: Binary package ${pkg} not installed.\n` +
                `This usually means your platform wasn't detected correctly at install time.\n` +
                `Try: npm install ${pkg}\n` +
                `Or install manually: https://github.com/urwithajit9/evnx/releases`
              );
            }

            const pkgDir  = path.dirname(pkgJsonPath);
            const binName = process.platform === "win32" ? "evnx.exe" : "evnx";
            const binPath = path.join(pkgDir, "bin", binName);

            if (!fs.existsSync(binPath)) {
              throw new Error(`evnx: Binary not found at expected path: ${binPath}`);
            }

            return binPath;
          }

          try {
            const binaryPath = getBinaryPath();
            const binDir     = path.join(__dirname, "bin");
            fs.mkdirSync(binDir, { recursive: true });

            if (process.platform === "win32") {
              const shim = `@echo off\r\n"${binaryPath}" %*\r\n`;
              fs.writeFileSync(path.join(binDir, "evnx.cmd"), shim);
            } else {
              const shim     = `#!/bin/sh\nexec "${binaryPath}" "$@"\n`;
              const shimPath = path.join(binDir, "evnx");
              fs.writeFileSync(shimPath, shim);
              fs.chmodSync(shimPath, 0o755);
            }

            console.log(`evnx installed for ${process.platform}/${process.arch}`);
          } catch (err) {
            process.stderr.write(`\nWARNING: ${err.message}\n\n`);
            process.exit(0);
          }
          INSTALLEOF

          cat > npm-publish/evnx/package.json << EOF
          {
            "name": "@evnx/cli",
            "version": "$VERSION",
            "description": "Manage .env files — validate, scan for secrets, convert formats, and sync them end-to-end encrypted",
            "keywords": ["dotenv", "env", "secrets", "cli", "security", "devtools", "environment"],
            "author": "Ajit Kumar <support@evnx.dev>",
            "license": "MIT",
            "homepage": "https://www.evnx.dev",
            "repository": {
              "type": "git",
              "url": "https://github.com/urwithajit9/evnx.git"
            },
            "bugs": {
              "url": "https://github.com/urwithajit9/evnx/issues"
            },
            "bin": {
              "evnx": "bin/evnx"
            },
            "scripts": {
              "postinstall": "node install.js"
            },
            "optionalDependencies": {
              "@evnx/evnx-linux-x64":    "$VERSION",
              "@evnx/evnx-linux-arm64":  "$VERSION",
              "@evnx/evnx-darwin-x64":   "$VERSION",
              "@evnx/evnx-darwin-arm64": "$VERSION",
              "@evnx/evnx-win32-x64":    "$VERSION"
            },
            "engines": {
              "node": ">=14"
            },
            "files": [
              "bin/",
              "install.js",
              "README.md"
            ]
          }
          EOF

          # Placeholder bin/evnx — install.js replaces this at postinstall time
          printf '#!/bin/sh\necho "evnx: run npm install to complete setup" >&2\nexit 1\n' \
            > npm-publish/evnx/bin/evnx
          chmod +x npm-publish/evnx/bin/evnx

          echo "Wrapper package ready:"
          find npm-publish/evnx -type f | sort

      # ── Inject READMEs — runs AFTER package dirs are created above ──────────
      - name: Inject README files into npm packages
        run: |
          cp README.md npm-publish/evnx/README.md

          for pkg_dir in npm-publish/packages/*/; do
            pkg_name=$(basename "$pkg_dir")
            cat > "${pkg_dir}README.md" << EOF
          # @evnx/${pkg_name}

          This is an internal platform-specific binary package for the evnx CLI.

          **Do not install this directly.** Install the main package instead:

          \`\`\`bash
          npm install -g @evnx/cli
          \`\`\`

          See https://www.evnx.dev for documentation.
          EOF
          done

          echo "READMEs injected:"
          find npm-publish/ -name "README.md" | sort

      # ── Dry run validation ──────────────────────────────────────────────────
      - name: Validate all packages (dry run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Platform packages ==="
          for pkg_dir in npm-publish/packages/*/; do
            echo "--- $pkg_dir ---"
            cat "$pkg_dir/package.json"
            (cd "$pkg_dir" && npm publish --dry-run --access public)
            echo "✓ dry run passed"
          done

          echo "=== Wrapper package ==="
          cat npm-publish/evnx/package.json
          (cd npm-publish/evnx && npm publish --dry-run --access public)
          echo "✓ dry run passed"

      # ── Publish platform packages first ────────────────────────────────────
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg_dir in npm-publish/packages/*/; do
            pkg_name=$(node -p "require('./${pkg_dir}package.json').name")
            echo "Publishing $pkg_name..."
            # ⚠️ Only a version conflict is survivable. `|| echo` used to catch
            # *any* non-zero exit and turn it into a green step — which is how
            # v0.4.0 reported success while publishing nothing: the npm token had
            # expired, and npm answers an unauthorised publish to an existing
            # package with **404, not 403**, so the failure read like a missing
            # package and the `||` swallowed it.
            if out=$(cd "$pkg_dir" && npm publish --access public --provenance 2>&1); then
              echo "$out"
              echo "✓ $pkg_name published"
            else
              echo "$out"
              if grep -qi "previously published versions\|EPUBLISHCONFLICT" <<<"$out"; then
                echo "⚠ $pkg_name is already at this version, skipping"
              else
                echo "::error::$pkg_name failed to publish — see the output above"
                exit 1
              fi
            fi
          done

      # ── Confirm the platform packages before the wrapper points at them ────
      # ⚠️ This was `sleep 30`, and a fixed sleep cannot tell whether anything
      # arrived. It matters more than it looks:
      #
      # The wrapper pins EXACT versions of all five platform packages, and it
      # pins them as `optionalDependencies` — which npm **skips without failing**
      # when one cannot be resolved. So a platform package that did not publish
      # produces a perfectly successful `npm install -g @evnx/cli` and a binary
      # that is simply missing at runtime, on that one architecture. The smoke
      # test runs on linux-x64 and can never see the other four.
      #
      # Reading the registry back also makes the loop above's "already at this
      # version, skipping" safe on a manual re-run: what is verified is the end
      # state, not whether this particular run did the publishing.
      - name: Await platform packages in the registry
        run: |
          set -euo pipefail
          for pkg in evnx-linux-x64 evnx-linux-arm64 evnx-darwin-x64 \
                     evnx-darwin-arm64 evnx-win32-x64; do
            ./scripts/npm-await.sh version "@evnx/$pkg" "$VERSION" 300
          done
          echo "✓ all five platform packages resolve at $VERSION"

      - name: Publish wrapper package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          (cd npm-publish/evnx && npm publish --access public --provenance)
          echo "✓ Published @evnx/cli@$VERSION"

      # ── Verify the registry, then install ──────────────────────────────────
      # ⚠️ The old version used `npm install -g` as the availability probe and
      # retried it five times over a 90-second budget. Two consequences:
      #
      #   * 90 seconds is not enough for npm's asynchronous pipeline. v0.5.2
      #     published correctly to all six packages and went red here anyway.
      #   * A failed install could not be told apart from "not propagated yet",
      #     so the failure never said which had happened.
      #
      # Now the registry is polled directly — cheap, and it answers exactly one
      # question — and the install runs once, after the answer is yes. A failure
      # therefore names which half broke.
      - name: Verify the registry and install
        run: |
          set -euo pipefail

          # 1. The exact version must be resolvable.
          ./scripts/npm-await.sh version @evnx/cli "$VERSION" 300

          # 2. ⚠️ And `latest` must point at it. The old smoke test installed
          #    `@evnx/cli@$VERSION` — pinned — so it passed even when the tag
          #    still pointed at the previous release, which is precisely what a
          #    plain `npm install -g @evnx/cli` hands every user. Nothing in this
          #    workflow could observe that before.
          ./scripts/npm-await.sh dist-tag @evnx/cli latest "$VERSION" 180

          # 3. One install, now that the registry is known to be ready.
          npm install -g "@evnx/cli@$VERSION"

          # 4. Assert what it prints. The old step ran `evnx --version` and threw
          #    the output away, so any binary that started would have passed.
          #    Matched on a word boundary so 0.5.30 cannot satisfy 0.5.3.
          got=$(evnx --version)
          echo "evnx --version → $got"
          if ! grep -qE "(^| )${VERSION//./\\.}( |\$)" <<<"$got"; then
            echo "::error::installed @evnx/cli@$VERSION but the binary reports: $got"
            exit 1
          fi
          echo "✓ @evnx/cli@$VERSION installs, is the 'latest' tag, and reports $VERSION"

      # ── Append npm note to the GitHub Release ──────────────────────────────
      - name: Add npm install note to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          RELEASE_ID=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG --jq '.id')

          if [[ -n "$RELEASE_ID" ]]; then
            EXISTING_BODY=$(gh api repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID --jq '.body')

            NPM_NOTE="

          ### npm / Node.js
          \`\`\`bash
          npm install -g @evnx/cli          # global install
          npx @evnx/cli --version           # zero-install usage
          npm install --save-dev @evnx/cli  # project dev dependency
          \`\`\`
          "

            gh api --method PATCH \
              repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID \
              --field "body=${EXISTING_BODY}${NPM_NOTE}"

            echo "✓ Updated release notes"
          fi