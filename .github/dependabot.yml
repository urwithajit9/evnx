# ⚠️ This exists because every action is now pinned to a commit SHA, and a SHA
# does not update itself. Pinning without this trades "a tag could move under
# us" for "we are frozen on whatever was current in October 2026, including the
# security fixes we never pick up" — which is the worse of the two.
#
# Dependabot understands the `# v4` comment beside each pin: it bumps the SHA
# and rewrites the comment together, so the file stays readable.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for minor and patch bumps, rather than one per action.
    # ⚠️ Separate PRs for those would mean up to 18 CI runs a week on a matrix
    # that builds seven targets, for updates almost always reviewed together.
    #
    # ⛔ **Majors are deliberately NOT grouped.** The first grouped run bundled
    # `actions/checkout` v4→v7, `setup-node` v4.4.0→v7 and
    # `action-download-artifact` v9→v27 together with ten patch bumps, in one
    # PR, a week before a release. A major that needs reading should not arrive
    # welded to nine that do not — Dependabot opens those individually now.
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # ⚠️ Security updates only for the dependency tree. A weekly PR for every
    # patch release of every transitive crate is how a bot gets muted, and a
    # muted bot is worse than no bot. `cargo audit` already runs in CI for the
    # advisories that matter.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
