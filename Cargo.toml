[package]
name        = "evnx"
version     = "0.3.8"
edition     = "2021"
authors     = ["Ajit Kumar <ajitkumar.pu@gmail.com>"]
description = "A comprehensive CLI tool for managing .env files — validation, secret scanning, and format conversion"
repository  = "https://github.com/urwithajit9/evnx"
homepage    = "https://evnx.dev"
documentation = "https://evnx.dev"
keywords    = ["env", "dotenv", "secrets", "cli", "devops"]
categories  = ["command-line-utilities", "development-tools"]
license     = "MIT"
readme      = "README.md"

[[bin]]
name = "evnx"
path = "src/main.rs"

[lib]
name = "evnx"
path = "src/lib.rs"

# ─── Dependencies ─────────────────────────────────────────────────────────────

[dependencies]

# CLI framework
clap          = { version = "4",    features = ["derive", "cargo", "env"] }
clap_complete = "4"

# Data structures
indexmap = { version = "2.1", features = ["serde"] }

# Interactive prompts
dialoguer = "0.11"

# Terminal output
console   = "0.15"
colored   = "2"

# Progress bars — used in utils/ui.rs and migrate/destinations/github.rs;
# always compiled so both call-sites can import without a feature gate.
indicatif = "0.17"

# Serialization
serde      = { version = "1",   features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml       = "0.8"

# Base64 — used in core/converter.rs (convert command) and github.rs (encryption);
# always compiled for the same reason as indicatif above.
base64 = "0.22"

# Core utilities
tempfile   = "3.10"
regex      = "1"
lazy_static = "1.4"
dotenvy    = "0.15"
chrono     = "0.4"
glob       = "0.3"
walkdir    = "2"
dirs       = "5"

# Error handling
anyhow    = "1"
thiserror = "1"

# Zeroize is always compiled (used in backup structs even without the backup feature)
zeroize = { version = "1.7", features = ["derive"] }

# ── migrate feature ───────────────────────────────────────────────────────────
# base64 and indicatif are already always-on above, so only reqwest and
# crypto_box (sealed-box encryption for GitHub) are optional here.
# replaced "rustls-tls" with "rustls-tls-native-roots" which pulls ring and that was creating cross compilation issues, again, native-tls
# reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "blocking"], optional = true }
# reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking"], optional = true }
# reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored", "blocking"], optional = true }
# Cargo.toml — back to rustls, ring is no longer in the tree
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"], optional = true }
crypto_box = { version = "0.9",  features = ["std"],                                                      optional = true }

# ── cloud feature ─────────────────────────────────────────────────────────────
# Zero-knowledge primitives, the same published crate evnx-server links against so
# both ends of the wire agree byte for byte. From crates.io, never a path dep — a
# path dep would make `cargo install evnx --features cloud` impossible, because
# `cargo publish` rejects one without an already-published version.
#
# reqwest is not repeated here: `cloud` reuses the optional dependency the migrate
# feature already declares above, so there is one HTTP stack in the tree and one
# set of TLS decisions to maintain.
evnx-crypto = { version = "0.1", optional = true }
# SRP ephemerals and proofs are hex on the wire. Already in the build graph as a
# dependency of evnx-crypto, so naming it here adds no crates.
hex = { version = "0.4", optional = true }
# Transport integrity hash on pushed blobs — the server recomputes and compares.
# Already in the graph via evnx-crypto, so this adds no crates.
blake3 = { version = "1", optional = true }
# Format-preserving TOML editing for the `.evnx.toml` vault binding. A user's
# config holds their comments and settings evnx does not model; rewriting it from
# a typed struct would discard both. Already in the graph via `toml`.
toml_edit = { version = "0.22", optional = true }
# Renders the TOTP enrolment QR in the terminal. default-features = false keeps
# it to exactly one crate with no transitive dependencies — the image and svg
# renderers are not wanted. Without it, enrolling means typing 32 base32
# characters into a phone by hand.
qrcode = { version = "0.14", default-features = false, optional = true }

# ── backup feature ────────────────────────────────────────────────────────────
aes-gcm = { version = "0.10", optional = true }
argon2  = { version = "0.5",  optional = true }
rand    = { version = "0.10", optional = true }

# ─── Dev / build dependencies ─────────────────────────────────────────────────

[dev-dependencies]
# Local HTTP server for the cloud client's tests. A dev-dependency, so it never
# reaches the shipped binary or a user's tree — it lets the tests produce the
# conditions a live server cannot summon on demand: 429 without burning the real
# rate limit, 423, 500, and a refresh token the server has already revoked.
mockito            = "1"
# The SRP *server* half, so the login tests can produce a genuine M2 and cover
# the success path in CI. Both are already in the graph via evnx-crypto, so this
# adds no crates. evnx-server's own tests do the same in reverse.
srp                = "0.6"
sha2               = "0.10"
assert_cmd         = "2"
predicates         = "3"
serde_json         = "1.0"
tempfile           = "3"
pretty_assertions  = "1"
serial_test        = "3.0"

[build-dependencies]
serde_json = "1.0"

# ─── Features ────────────────────────────────────────────────────────────────

[features]
default = []
migrate = ["dep:reqwest", "dep:crypto_box"]
backup  = ["dep:aes-gcm", "dep:argon2",  "dep:rand"]
cloud   = ["dep:evnx-crypto", "dep:reqwest", "dep:hex", "dep:blake3", "dep:toml_edit", "dep:qrcode"]
# `cloud` is deliberately NOT in `full`, and not enabled in the prebuilt binaries.
# Adding it would silently change what `full` and `--all-features` mean for people
# already using them, and hand network-capable code to users who never opted in.
full    = ["migrate", "backup"]

# ─── Build profiles ──────────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0